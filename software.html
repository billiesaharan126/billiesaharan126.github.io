<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Development | Jeremy Jackson</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="writing.html">Writing</a>
        <a href="software.html">Software Development</a>
    </nav>

    <main>
        <section class="portfolio-section">

            <h1>Software Development</h1>

            <div id="software-container"></div>

        </section>
    </main>


    <script src="js/portfolio.js"></script>

    <script>
        const container = document.getElementById("software-container");

        softwareProjects.forEach(project => {

            container.innerHTML += `
                <div class="portfolio-card">

                    <div class="project-image">
                        ${project.image ? `<img src="${project.image}" alt="${project.title}">` : ""}
                    </div>

                    <h2>
                        <a href="${project.link}">
                            ${project.title}
                        </a>
                    </h2>

                    <p>
                        ${project.description}
                    </p>

                    <a href="${project.github}">
                        GitHub
                    </a>

                </div>
            `;

        });
    </script>

</body>

</html>
